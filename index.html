<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musbix AI - Süni İntellektlə Musiqi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f13; color: white; text-align: center; margin: 0; padding: 50px 20px; }
    h1 { font-size: 2.5em; color: #00e5ff; margin-bottom: 10px; }
    .container { max-width: 600px; margin: 0 auto; background: #1a1a24; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,229,255,0.1); }
    textarea { width: 100%; height: 80px; background: #0f0f13; color: white; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; resize: none; font-size: 1em; box-sizing: border-box; }
    button { background: #00e5ff; color: #0f0f13; border: none; padding: 15px 30px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin: 5px; }
    button:hover { background: #00b3cc; transform: translateY(-2px); }
    button:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; }
    .token-box { background: #2a2a35; display: inline-block; padding: 10px 20px; border-radius: 20px; color: #00e5ff; font-weight: bold; margin-bottom: 20px; }
    .hidden { display: none; }
    #status { margin-top: 15px; font-size: 0.9em; color: #aaa; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Musbix AI</h1>
    <div class="token-box" id="jeton-display">300 Jeton</div>
    
    <!-- İstifadəçi maksimum 100 simvol yaza bilər -->
    <textarea id="prompt-input" maxlength="100" placeholder="Musiqi tərzini təsvir et (Maksimum 100 simvol)..."></textarea>
    
    <button id="generate-btn">Musiqini Sintez Et</button>
    <div id="status">Sizi gözləyir...</div>
    
    <div style="margin-top: 30px;">
      <h3 id="track-title" style="color: #fff; margin-bottom: 15px;"></h3>
      <button id="play-btn" class="hidden">▶ Dinlə</button>
      <button id="download-btn" class="hidden">⬇ Yüklə</button>
    </div>
  </div>

  <script type="module">
    const els = {
      pInp: document.getElementById("prompt-input"),
      gBtn: document.getElementById("generate-btn"),
      pBtn: document.getElementById("play-btn"),
      dBtn: document.getElementById("download-btn"),
      jNum: document.getElementById("jeton-display"),
      pStat: document.getElementById("status"),
      tTit: document.getElementById("track-title")
    };

    let currentJeton = 300;
    let recorder;
    let audioUrl = null;

    // BURANI PYTHON SKRİPTİNİN VERDİYİ KODLA ƏVƏZ EDƏ BİLƏRSƏN
    const baseNotes = {
      "PI": "A5", "CB": "A5", "CE": "A5", "FL": "A5", "VI": "A5", 
      "BE": "A5", "OR": "A5", "HR": "A5", "FH": "A5", "TR": "A5",
      "TP": "A5", "TB": "A5", "GE": "A5", "GA": "A5", "XY": "A5"
    };

    els.gBtn.addEventListener("click", async () => {
      const userPrompt = els.pInp.value.trim();
      if (!userPrompt) return alert("Zəhmət olmasa bir təsvir daxil edin.");
      
      els.gBtn.disabled = true; els.gBtn.innerText = "Sintez Edilir...";
      els.pBtn.classList.add("hidden"); els.dBtn.classList.add("hidden");
      els.pStat.innerText = "Musbix Mühərriki kodu yazır...";

      try {
        const res = await fetch('/api/generate', {
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ prompt: userPrompt })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Server xətası baş verdi");

        const musbixCode = data.result;

        // YENİ JETON HESABLAMASI: Hər 100 simvola 10 jeton
        let charCount = musbixCode.length;
        let tokenCost = Math.ceil(charCount / 100) * 10;
        if (currentJeton < tokenCost) {
          throw new Error(`Kifayət qədər jetonunuz yoxdur. Bu musiqi üçün ${tokenCost} jeton lazımdır.`);
        }
        currentJeton = Math.max(0, currentJeton - tokenCost); 
        els.jNum.innerText = `${currentJeton} Jeton`;

        // PARSER MÜHƏRRİKİ
        const lines = musbixCode.split('\n');
        const playData = [];
        const usedInstruments = new Set();

        lines.forEach(line => {
          line = line.trim();
          if (!line || line.startsWith('//')) return; 

          const match = line.match(/^([A-Z]{2}):([A-Za-z0-9#b]+)-([0-9.]+)$/);
          if (match) {
            const [, inst, note, time] = match;
            playData.push({ inst, note, time: parseFloat(time) });
            usedInstruments.add(inst);
          }
        });

        if (playData.length === 0) throw new Error("AI düzgün formatda kod qaytarmadı.");

        els.pStat.innerText = "Ağıllı alət yüklənməsi aparılır...";

        // Yalnız istifadə olunan səs fayllarını Vercel-dən çəkirik
        const samplers = {};
        const loadPromises = Array.from(usedInstruments).map(instCode => {
          return new Promise((resolve) => {
            const baseNote = baseNotes[instCode] || "A5"; // Python siyahısında yoxdursa, A5 qəbul et
            samplers[instCode] = new Tone.Sampler({
              urls: { [baseNote]: `${instCode}.mp3` },
              baseUrl: `/samples/`,
              onload: resolve
            }).toDestination();
          });
        });

        await Promise.all(loadPromises);
        
        if (!recorder) recorder = new Tone.Recorder();
        Object.values(samplers).forEach(sampler => sampler.connect(recorder));

        Tone.Transport.cancel();
        let maxTime = 0;
        
        playData.forEach(({ inst, note, time }) => {
          Tone.Transport.schedule((t) => {
            samplers[inst].triggerAttackRelease(note, "8n", t);
          }, "+" + time);
          if (time > maxTime) maxTime = time;
        });

        els.tTit.innerText = "Musbix Orijinal Kompozisiyası"; 
        els.pStat.innerText = "Tam hazırdır!"; 
        els.pBtn.classList.remove("hidden");
        
        // RECORDER VƏ PLAY LOGIC
        els.pBtn.onclick = async () => {
          await Tone.start();
          Tone.Transport.stop();
          Tone.Transport.position = 0;
          recorder.start();
          Tone.Transport.start();
          
          els.pBtn.innerText = "Çalınır..."; els.pBtn.disabled = true;
          
          // Musiqi bitəndə recordu saxla və yükləmə düyməsini aç
          setTimeout(async () => {
            Tone.Transport.stop();
            els.pBtn.innerText = "▶ Yenidən Dinlə"; els.pBtn.disabled = false;
            
            const recording = await recorder.stop();
            audioUrl = URL.createObjectURL(recording);
            els.dBtn.classList.remove("hidden");
          }, (maxTime + 2) * 1000); // Saniyə hesablaması (+2 saniyə uzantı)
        };

        els.dBtn.onclick = () => {
          const anchor = document.createElement("a");
          anchor.download = "musbix-audio.webm";
          anchor.href = audioUrl;
          anchor.click();
        };

      } catch (err) {
        alert("Xəta: " + err.message);
        els.pStat.innerText = "Uğursuz əməliyyat.";
      } finally {
        els.gBtn.disabled = false; els.gBtn.innerText = "Musiqini Sintez Et";
      }
    });
  </script>
</body>
</html>
